name: SIRAI visual browser checks
on:
  pull_request:
  push:
    branches: [design/editorial-cinematic-20261106]
  workflow_dispatch:
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test desktop, mobile, RTL, indicators, reduced motion
        run: node tests/editorial-browser-check.mjs
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sirai-editorial-browser-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
