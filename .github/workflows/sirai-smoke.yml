name: SIRAI static smoke checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/community-hub.js
          node --check assets/idea-form.js
          node --check assets/sirai-math.js
          node --check assets/policies.js
          node --check assets/feedback.js
          node --check assets/offline-images.js
          node --check sw.js
      - name: Check pages, references and disclosures
        run: |
          node tests/site-smoke.mjs
          node tests/compliance-smoke.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sirai-test-server.log 2>&1 &
          sleep 2
      - name: Audit desktop and mobile pages
        run: node tests/browser-smoke.mjs
      - name: Preserve screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sirai-desktop-mobile-audit
          path: test-screenshots/
          if-no-files-found: ignore
