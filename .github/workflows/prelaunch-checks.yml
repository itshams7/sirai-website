name: SIRAI pre-launch checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
      - name: Validate offline package and accessible controls
        run: node tests/prelaunch-check.mjs
