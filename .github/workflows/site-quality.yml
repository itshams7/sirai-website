name: SIRAI quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in assets/*.js sw.js; do node --check "$file"; done
      - name: Verify planning calculations
        run: node tests/math-check.mjs
      - name: Verify site integrity
        run: node tests/smoke.mjs
