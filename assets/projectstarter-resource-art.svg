      <rect x="259" y="134" width="111" height="6" rx="3" fill="#47775d"/>
      <rect x="259" y="146" width="81" height="4" rx="2" fill="#b3cbb8"/>

      <rect x="220" y="170" width="25" height="25" rx="7" fill="#467f5d"/>
      <path d="m227 182 5 5 8-9" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="259" y="173" width="103" height="6" rx="3" fill="#47775d"/>
      <rect x="259" y="185" width="67" height="4" rx="2" fill="#b3cbb8"/>

      <rect x="220" y="209" width="25" height="25" rx="7" fill="#f4ead1" stroke="#c1a675" stroke-width="1.4"/>
      <circle cx="232.5" cy="221.5" r="4.2" fill="#d1ac67"/>
      <rect x="259" y="212" width="96" height="6" rx="3" fill="#77977e"/>
      <rect x="259" y="224" width="119" height="4" rx="2" fill="#b3cbb8"/>
    </g>
    <rect x="222" y="258" width="157" height="7" rx="3.5" fill="#d2e3d4"/>
    <rect x="222" y="258" width="104" height="7" rx="3.5" fill="#5c9c72"/>
    <circle cx="329" cy="261.5" r="8.5" fill="#f6f3de" stroke="#5c9c72" stroke-width="2"/>
    <circle cx="329" cy="261.5" r="3.3" fill="#438d64"/>
  </g>

  <!-- The outcome: the idea becomes a completed action -->
  <g filter="url(#ps-shadow)">
    <circle cx="437" cy="252" r="42" fill="#fffaf0" stroke="#92b59a" stroke-width="1.6"/>
    <circle cx="437" cy="252" r="30" fill="#e2efe0"/>
  </g>
  <g fill="none" stroke="#2c6c4b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M428 265V238"/>
    <path d="M429 238h25l-6 9 6 9h-25"/>
    <path d="m431 247 4 4 8-9" stroke="#bd9150" stroke-width="2.8"/>
