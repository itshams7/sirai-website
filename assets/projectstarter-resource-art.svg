  <circle cx="461" cy="194" r="3.3" fill="#bd955c"/>
  <circle cx="483" cy="222" r="2.5" fill="#4b8662"/>
  <path d="m456 136 3-8 3 8 8 3-8 3-3 8-3-8-8-3Z" fill="#c2a16a" opacity=".8"/>
</svg>