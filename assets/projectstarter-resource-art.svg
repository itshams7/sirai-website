<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" role="img" aria-label="An idea becoming a structured community project plan">
  <defs>
    <linearGradient id="ps-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf1e6"/>
      <stop offset="1" stop-color="#c8ddce"/>
    </linearGradient>
    <linearGradient id="ps-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#edf5eb"/>
    </linearGradient>
    <linearGradient id="ps-idea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8c69"/>
      <stop offset="1" stop-color="#1d513d"/>
    </linearGradient>
    <pattern id="ps-grid" width="23" height="23" patternUnits="userSpaceOnUse">
      <path d="M23 0H0V23" fill="none" stroke="#7daa91" stroke-width=".7" opacity=".25"/>
      <circle cx="0" cy="0" r="1.2" fill="#719a7f" opacity=".28"/>
    </pattern>
    <filter id="ps-shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#194b38" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="540" height="330" fill="url(#ps-bg)"/>
  <rect width="540" height="330" fill="url(#ps-grid)"/>
  <circle cx="504" cy="12" r="173" fill="none" stroke="#fbfff6" stroke-width="1.2" opacity=".68"/>
  <circle cx="504" cy="12" r="127" fill="none" stroke="#fbfff6" stroke-width="1.2" opacity=".48"/>
  <circle cx="19" cy="338" r="153" fill="#a9cdb4" opacity=".23"/>
  <path d="M29 269C112 290 156 243 176 201" fill="none" stroke="#39765a" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round" opacity=".55"/>
  <path d="M380 227C421 218 441 229 463 252" fill="none" stroke="#39765a" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round" opacity=".55"/>

  <!-- The spark: a community idea -->
  <g filter="url(#ps-shadow)">
    <circle cx="112" cy="179" r="61" fill="#f5faf0" stroke="#83b294" stroke-width="1.5"/>
    <circle cx="112" cy="179" r="48" fill="url(#ps-idea)"/>
  </g>
  <g stroke="#f5efce" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M99 177a14 14 0 1 1 26 0c-2 4-6 7-7 12h-12c-1-5-5-8-7-12Z"/>
    <path d="M106 195h12M108 201h8M112 145v-8M85 156l-6-6M139 156l6-6M80 178h-8M144 178h8"/>
  </g>
  <g fill="#dbbf80">
