  <circle cx="175" cy="125" r="6.5" fill="#e2c58d" stroke="#f8faef" stroke-width="2"/>

  <!-- The plan: a checklist, task lines, and a visible progress path -->
  <g filter="url(#ps-shadow)">
    <rect x="193" y="39" width="222" height="263" rx="17" fill="url(#ps-paper)" stroke="#9cbea5" stroke-width="1.8"/>
    <rect x="211" y="58" width="186" height="48" rx="11" fill="#dfece0"/>
    <rect x="224" y="73" width="27" height="18" rx="5" fill="#386e52"/>
